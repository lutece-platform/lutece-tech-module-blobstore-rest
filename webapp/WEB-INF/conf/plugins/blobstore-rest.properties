################################################################################
# Configuration file for BlobStore REST module

# Signature check of the /rest/blobstore endpoints. Leave it on.
# Setting it to false serves every call unchecked, including the write endpoints
# create and delete - it exists so TestBlobStoreRest.jsp can be driven locally,
# which in v7 meant commenting the <filters> block out of the plugin descriptor.
blobstore-rest.security.activated=true

# How that check is configured. Read by AbstractSignRequestAuthenticatorProducer
# (library-signrequest) under the prefix blobstore-rest.requestAuthenticator.
# Reproduces the v7 descriptor: same authenticator, same signature elements in the
# same order, same private key placeholder. A name the producer does not know is an
# error, not a way to switch the check off - use the key above for that.
blobstore-rest.requestAuthenticator.name=signrequest.HeaderHashAuthenticator
blobstore-rest.requestAuthenticator.cfg.hashService=signrequest.Sha1HashService
blobstore-rest.requestAuthenticator.cfg.signatureElements=blob_key,blobstore
blobstore-rest.requestAuthenticator.cfg.privateKey=change me
